services:
  wiremock:
    image: wiremock/wiremock:3.9.2
    container_name: book-slot-wiremock
    ports:
      - "8080:8080"
    volumes:
      - ./wiremock:/home/wiremock
    networks:
      - book-slot-net

  app:
    build: .
    container_name: book-slot-app
    ports:
      - "8082:80"
    depends_on:
      - wiremock
    networks:
      - book-slot-net

networks:
  book-slot-net:
    name: book-slot-net
