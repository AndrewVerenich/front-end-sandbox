<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Leads Desk</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="layout">
      <header class="site-header">
        <h1>Leads Desk</h1>
      </header>

      <section class="panel" aria-labelledby="new-lead-title">
        <h2 id="new-lead-title">New lead</h2>
        <p class="tagline" style="margin: -0.5rem 0 1rem">
          To demo a validation error, use an email containing <strong>reject-me@</strong> (any domain).
        </p>
        <form id="lead-form" novalidate>
          <div class="form-grid two">
            <div>
              <label for="fullName">Full name</label>
              <input id="fullName" name="fullName" type="text" required maxlength="120" autocomplete="name" />
            </div>
            <div>
              <label for="email">Email</label>
              <input id="email" name="email" type="email" required autocomplete="email" />
            </div>
            <div>
              <label for="phone">Phone</label>
              <input id="phone" name="phone" type="tel" maxlength="40" autocomplete="tel" />
            </div>
            <div>
              <label for="source">Source</label>
              <select id="source" name="source" required>
                <option value="">Select…</option>
                <option value="WEB">Website</option>
                <option value="PARTNER">Partner</option>
                <option value="REFERRAL">Referral</option>
                <option value="EVENT">Event</option>
              </select>
            </div>
          </div>
          <div class="form-grid" style="margin-top: 1rem">
            <div>
              <label for="note">Note</label>
              <textarea id="note" name="note" maxlength="2000" placeholder="Context, product interest, urgency…"></textarea>
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="submit-btn">Submit lead</button>
          </div>
        </form>
        <div id="form-message" class="message" role="status" aria-live="polite"></div>
      </section>

      <section class="panel" aria-labelledby="inbox-title">
        <h2 id="inbox-title">Inbox (NEW)</h2>
        <p id="list-status" class="loading">Loading…</p>
        <div style="overflow-x: auto">
          <table id="leads-table" hidden>
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Source</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="leads-tbody"></tbody>
          </table>
        </div>
      </section>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/index.js"></script>
  </body>
</html>
