services:
  wiremock:
    image: wiremock/wiremock:3.9.2
    container_name: leads-desk-wiremock
    volumes:
      - ./wiremock:/home/wiremock
    networks:
      - leads-desk-net

  nginx:
    image: nginx:alpine
    container_name: leads-desk-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/usr/share/nginx/html:ro
    depends_on:
      - wiremock
    networks:
      - leads-desk-net

networks:
  leads-desk-net:
    name: leads-desk-net
